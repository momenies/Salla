{% extends 'layout.html' %}
{% block title %}{{ title }} · {{ appName }}{% endblock %}
{% block pagename %}{{ title }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px; margin:40px auto">
  <div class="empty">
    <div class="empty-art" style="font-size:30px; font-weight:800">{{ code }}</div>
    <h3>{{ title }}</h3>
    <p>{{ message }}</p>
    {% if detail %}
    <pre class="ltr small" style="background:var(--surface-3); padding:12px; border-radius:10px; overflow:auto; text-align:left">{{ detail }}</pre>
    {% endif %}
    <div class="row gap-sm" style="justify-content:center">
      <a href="/" class="btn btn-primary"><svg class="ic ic-sm"><use href="#i-home"/></svg> العودة للوحة</a>
      <button type="button" class="btn btn-ghost" onclick="history.back()">رجوع</button>
    </div>
  </div>
</div>
{% endblock %}
