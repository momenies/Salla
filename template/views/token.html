{% extends 'layout.html' %}
{% block content %}

<div class="card" style="max-width:560px; margin:30px auto; text-align:center; padding:40px 30px">
    <div style="width:84px; height:84px; margin:0 auto 20px; border-radius:26px;
         background:linear-gradient(135deg,#d1fae5,#a7f3d0); display:grid; place-items:center">
        <svg class="ic" style="width:42px;height:42px;color:#059669"><use href="#i-check"/></svg>
    </div>
    <h3 style="font-size:19px; font-weight:800">تم تحديث رمز الدخول بنجاح</h3>
    <p style="color:var(--muted); font-size:13.5px; line-height:2; margin:10px 0 22px">
        اتصال تطبيق «منقذ السلات» بمتجرك أصبح محدّثاً الآن، وستستمر مزامنة السلات المتروكة بشكل طبيعي.
    </p>
    <div dir="ltr" style="background:#f8fafc; border:1px dashed #cbd5e1; border-radius:11px; padding:12px 14px;
         font-size:11.5px; color:#64748b; font-family:monospace; word-break:break-all; text-align:left">
        {{ token.accessToken|truncate(18, true) }}••••••••••••
    </div>
    <a href="/" class="btn btn-primary" style="margin-top:24px">العودة للوحة التحكم</a>
</div>

{% endblock %}
